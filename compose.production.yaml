services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: foci-todo-backend:production
    environment:
      DATABASE_URL: postgres://${DB_USER:?Set DB_USER}:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/${DB_NAME:?Set DB_NAME}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/database/migrate.js"]
    networks: [data]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: foci-todo-backend:production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${DB_USER:?Set DB_USER}:${DB_PASSWORD:?Set DB_PASSWORD}@db:5432/${DB_NAME:?Set DB_NAME}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [edge, data]

  web:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    image: foci-todo-web:production
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile.production", "--adapter", "caddyfile"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [edge]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  edge:
  data:
    internal: true
