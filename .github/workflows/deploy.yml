name: Deploy

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: foci-todo-ec2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        vars.DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: foci-todo-deploy
      - name: Deploy verified commit through Systems Manager
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_SITE_URL: ${{ vars.DEPLOY_SITE_URL }}
        run: python3 scripts/deploy-via-ssm.py
