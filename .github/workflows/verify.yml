name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:quality
      - run: npm run setup:local
      - run: npm run typecheck:backend
      - run: npm run test:backend
      - run: npm run test:postgres
      - run: npm run build:backend
      - run: npm run typecheck:frontend
      - run: npm run build:frontend
      - run: PLAYWRIGHT_BROWSERS_PATH=0 ./node_modules/.bin/playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
      - run: docker compose build backend web
      - run: docker run --rm foci-todo-backend:local node -e "import('argon2').then(async m => { const hash = await m.default.hash('smoke-test'); if (!(await m.default.verify(hash, 'smoke-test'))) process.exit(1) })"
      - run: docker run --rm -e SITE_DOMAIN=tasks.example.com foci-todo-web:local caddy validate --config /etc/caddy/Caddyfile.production --adapter caddyfile
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
