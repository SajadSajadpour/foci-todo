name: foci-todo-tests

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: foci_test
      POSTGRES_PASSWORD: foci_test_local_only
      POSTGRES_DB: foci_todo_test
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foci_test -d foci_todo_test"]
      interval: 2s
      timeout: 2s
      retries: 15
